name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Syntax check server and extension scripts
        run: |
          for f in server/index.js server/ocr.js server/ocr-select.js server/uploads.js server/storage.js extension/popup.js extension/tab.js; do
            node --check "$f"
          done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      # No MinIO image is left on Docker Hub (minio/minio was removed), so this pins a maintained fork by tag.
      - name: Start MinIO
        run: |
          docker run -d --name trakie-minio -p 59000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 60); do
            curl -fs http://localhost:59000/minio/health/live && break
            sleep 1
          done
          curl -fs http://localhost:59000/minio/health/live

      - name: Tests (a missing MinIO fails them, it never skips them)
        working-directory: server
        env:
          TRAKIE_REQUIRE_MINIO: "1"
        run: npm test

      - name: Every upload guard has a mutant that the tests catch
        working-directory: server
        run: node tests/mutants.mjs

      - name: Boot the server and hit it
        working-directory: server
        env:
          OPENAI_API_KEY: dummy-key-not-used
          PORT: "3917"
        run: |
          node index.js &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -fs http://localhost:3917/ && break
            sleep 0.5
          done
          curl -fs http://localhost:3917/ | grep '"status":"ok"'
          curl -fs -o /dev/null http://localhost:3917/m/
          kill "$server_pid"
